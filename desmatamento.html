<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espécies Ameaçadas - SiBBr</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gray-50 min-h-screen p-4">
    <!-- Menu de navegação -->
    <nav class="flex justify-center mb-8 space-x-6">
      <a
        href="index.html"
        class="text-green-700 font-semibold hover:text-green-900 transition"
        >Espécies Ameaçadas</a
      >
      <a
        href="desmatamento.html"
        class="text-green-700 font-semibold hover:text-green-900 transition"
        >Desmatamento</a
      >
    </nav>

    <div class="max-w-6xl mx-auto">
      <!-- Cabeçalho -->
      <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-green-800 mb-2">
          <i class="fas fa-paw mr-2"></i> Espécies Ameaçadas no Brasil
        </h1>
        <p class="text-gray-600">
          Dados do
          <a
            href="https://www.sibbr.gov.br"
            target="_blank"
            class="text-blue-500 hover:underline"
            >SiBBr</a
          >
        </p>
      </header>

      <!-- Container do Gráfico -->
      <div class="bg-white p-6 rounded-xl shadow-lg mb-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-green-700">
            <i class="fas fa-chart-pie mr-2"></i> Distribuição por Categoria
          </h2>
          <button
            id="refreshBtn"
            class="px-3 py-1 bg-blue-100 text-blue-600 rounded text-sm hover:bg-blue-200 transition flex items-center gap-2"
          >
            <i id="refreshIcon" class="fas fa-sync-alt"></i>
            Atualizar
          </button>
        </div>
        <div class="chart-container relative">
          <div id="loading" class="loading-overlay">
            <div class="loading-spinner">
              <i class="fas fa-spinner fa-spin"></i>
            </div>
            <p>Carregando dados...</p>
          </div>
          <canvas id="speciesChart"></canvas>
        </div>
      </div>

      <!-- Tabela de Espécies -->
      <div class="bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">
          <i class="fas fa-list-ul mr-2"></i> Espécies em Destaque
        </h2>
        <div id="speciesTable" class="overflow-x-auto">
          <p class="text-gray-500 italic">Carregando lista de espécies...</p>
        </div>
      </div>

      <!-- Rodapé -->
      <footer class="mt-8 text-center text-sm text-gray-500">
        <p>Dados atualizados em: <span id="updateDate"></span></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
